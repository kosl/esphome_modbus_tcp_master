esphome:
  name: slow-modbus-test
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "your_ssid"
  password: "your_password"
  fast_connect: true
  power_save_mode: none

logger:
  level: DEBUG
  logs:
    modbus_tcp_manager: DEBUG

api:
ota:

external_components:
  - source: github://yourusername/esphome_modbus_tcp_master@improved  # Your improved fork
    components: [modbus_tcp_manager]
    refresh: 0s

# Modbus manager with slow device configuration
modbus_tcp_manager:
  id: slow_modbus_device
  host: "192.168.1.124"
  port: 502
  unit_id: 1
  # Extended timeouts for slow devices (up to 10 seconds)
  connection_timeout: 10s      # Time to wait for TCP connection
  read_timeout: 10s            # Time to wait for Modbus response
  
  # Optional: Watchdog for device health monitoring
  # watchdog_register: 999
  # watchdog_interval: 30s     # Longer interval for slow devices
  
  # Optional: Safe mode values if connection fails
  # safe_mode_registers:
  #   - register: 100
  #     value: 0              # Safe value when connection lost

# Connection status monitoring
binary_sensor:
  - platform: modbus_tcp_manager
    modbus_tcp_id: slow_modbus_device
    name: "Slow Modbus Connection"
    id: modbus_connection
    device_class: connectivity

sensor:
  # Read one sensor every 15 seconds (plenty of time for slow response)
  - platform: modbus_tcp_manager
    modbus_tcp_id: slow_modbus_device
    name: "Slow Temperature"
    register_address: 37000
    function_code: 3
    scale: 0.1
    update_interval: 15s       # Longer interval for slow devices
    unit_of_measurement: "°C"
    device_class: "temperature"
    accuracy_decimals: 1

  # Another sensor with staggered timing
  - platform: modbus_tcp_manager
    modbus_tcp_id: slow_modbus_device
    name: "Slow Pressure"
    register_address: 37001
    function_code: 3
    scale: 0.01
    update_interval: 20s       # Offset timing to prevent conflicts
    unit_of_measurement: "bar"
    device_class: "pressure"
    accuracy_decimals: 2

# Manual control for slow device
number:
  - platform: template
    name: "Slow Device Setpoint"
    id: slow_setpoint
    min_value: 0
    max_value: 100
    step: 0.1
    optimistic: true
    unit_of_measurement: "°C"
    set_action:
      then:
        - if:
            condition:
              binary_sensor.is_on: modbus_connection
            then:
              - lambda: |-
                  auto *modbus = id(slow_modbus_device);
                  if (modbus != nullptr) {
                    int16_t scaled_value = (int16_t)(x * 10);
                    bool success = modbus->write_register(37100, scaled_value);
                    if (success) {
                      ESP_LOGI("main", "Set slow device setpoint: %.1f°C", x);
                    } else {
                      ESP_LOGW("main", "Failed to write to slow device");
                    }
                  }
            else:
              - logger.log: "Cannot write - Slow Modbus offline"

# System status
text_sensor:
  - platform: template
    name: "Slow Device Status"
    update_interval: 30s
    lambda: |-
      if (!id(modbus_connection).state) {
        return {"Offline - Device not responding"};
      } else if (isnan(id(slow_temperature).state)) {
        return {"Connected - No data yet"};
      } else {
        return {"Online - " + to_string(id(slow_temperature).state) + "°C"};
      }

# Health monitoring
interval:
  - interval: 60s  # Less frequent for slow devices
    then:
      - lambda: |-
          ESP_LOGI("health", "ESP32 OK | Heap: %d | Slow Modbus: %s", 
                   esp_get_free_heap_size(),
                   id(modbus_connection).state ? "OK" : "OFFLINE");
