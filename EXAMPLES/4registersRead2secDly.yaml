esphome:
  name: modbus-test
  friendly_name: modbus_test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://Gucioo/esphome_modbus_tcp_master@slow-improved
    components: [modbus_tcp_manager]
    refresh: 0s  # Always use latest version during development

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:

captive_portal:


modbus_tcp_manager:
  id: slow_modbus_device
  host: "192.168.1.124"
  port: 502
  unit_id: 1
  connection_timeout: 10s
  read_timeout: 3s

# Template binary sensor (no component.update needed)
binary_sensor:
  - platform: template
    name: "Modbus Connection"
    id: modbus_connection
    device_class: connectivity
    lambda: |-
      auto *modbus = id(slow_modbus_device);
      return (modbus != nullptr) && modbus->is_connected();

text_sensor:
  - platform: template
    name: "Registers 37000-37003"
    id: all_registers_status
    update_interval: 10s
    lambda: |-
      auto *modbus = id(slow_modbus_device);
      if (modbus == nullptr || !modbus->is_connected()) {
        return {"Modbus Offline"};
      }
      
      // Using the async API (non-blocking)
      std::string result = "Reading...";
      
      modbus->read_registers_async(37000, 4, 
        esphome::modbus_tcp::ModbusFunction::READ_HOLDING_REGISTERS,
        [&result](const esphome::modbus_tcp::ModbusResponse& response) {
          if (response.success && response.data.size() == 4) {
            int16_t r0 = static_cast<int16_t>(response.data[0]);
            int16_t r1 = static_cast<int16_t>(response.data[1]);
            int16_t r2 = static_cast<int16_t>(response.data[2]);
            int16_t r3 = static_cast<int16_t>(response.data[3]);
            
            result = "37000:" + to_string(r0) + " 37001:" + to_string(r1) + 
                    " 37002:" + to_string(r2) + " 37003:" + to_string(r3);
            
            // Update the sensor from callback
            id(all_registers_status).publish_state(result);
          } else {
            result = "Read Failed: " + response.error_message;
            id(all_registers_status).publish_state(result);
          }
        });
      
      return {result};

sensor:
  - platform: template
    name: "Register 37000"
    id: reg_37000_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0
    
  - platform: template
    name: "Register 37001"
    id: reg_37001_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0
    
  - platform: template
    name: "Register 37002"
    id: reg_37002_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0
    
  - platform: template
    name: "Register 37003"
    id: reg_37003_sensor
    unit_of_measurement: ""
    accuracy_decimals: 0

# Use interval for async bulk updates
interval:
  - interval: 15s
    then:
      - lambda: |-
          auto *modbus = id(slow_modbus_device);
          if (modbus == nullptr || !modbus->is_connected()) {
            return;
          }
          
          ESP_LOGI("bulk", "Starting async bulk read...");
          
          // Async read - returns immediately, doesn't block ESPHome
          modbus->read_registers_async(37000, 4, 
            esphome::modbus_tcp::ModbusFunction::READ_HOLDING_REGISTERS,
            [](const esphome::modbus_tcp::ModbusResponse& response) {
              if (response.success && response.data.size() == 4) {
                id(reg_37000_sensor).publish_state(static_cast<int16_t>(response.data[0]));
                id(reg_37001_sensor).publish_state(static_cast<int16_t>(response.data[1]));
                id(reg_37002_sensor).publish_state(static_cast<int16_t>(response.data[2]));
                id(reg_37003_sensor).publish_state(static_cast<int16_t>(response.data[3]));
                
                ESP_LOGI("bulk", "Async bulk read completed successfully");
              } else {
                ESP_LOGW("bulk", "Async bulk read failed: %s", response.error_message.c_str());
              }
            });

# Update connection status periodically (using lambda, not component.update)
  - interval: 5s
    then:
      - lambda: |-
          // Manually trigger template binary sensor update
          auto *connection_sensor = id(modbus_connection);
          if (connection_sensor != nullptr) {
            auto *modbus = id(slow_modbus_device);
            bool connected = (modbus != nullptr) && modbus->is_connected();
            connection_sensor->publish_state(connected);
          }
